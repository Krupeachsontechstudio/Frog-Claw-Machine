<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frog Claw Machine – Food Vocab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Mali:wght@500;600;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
/* ================= ธีมสี ================= */
:root{--ink:#5a3a3a;--pink:#f7a8b8;--pink2:#f9c5d1;--pinkD:#ec8ea4;--cream:#fdf3f0;--frog:#c4e07d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:'Baloo 2','Mali','ZCOOL KuaiLe',sans-serif}
body{min-height:100vh;display:flex;justify-content:center;padding:6px 0 40px;overflow-x:hidden;
  background-image:radial-gradient(circle at 10% 20%,#fde4ea 0 2px,transparent 3px),radial-gradient(circle at 80% 60%,#fde4ea 0 2px,transparent 3px);background-size:60px 60px,80px 80px}
button{font-family:inherit;color:inherit}
.wrap{width:min(440px,94vw);display:flex;flex-direction:column;align-items:center}

/* ================= โลโก้ ================= */
.logo{width:100%;display:block;margin-bottom:2px}
.logo text{font-family:'Baloo 2',sans-serif;font-weight:800}

/* ================= HUD ================= */
.hud{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin:0 0 10px}
.pill{background:#fff;border:3px solid var(--ink);border-radius:999px;padding:1px 8px;font-weight:800;font-size:15px;box-shadow:0 3px 0 #f2c6d0;line-height:1.6;white-space:nowrap}
.btn-mute{cursor:pointer}
#lives{letter-spacing:0}
@media (max-width:400px){.pill{font-size:13px;padding:0 6px}}
.pill.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.25)}}

/* ================= ตัวตู้ ================= */
.machine{width:100%;position:relative}
.machine.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-7px) rotate(-1deg)}40%{transform:translateX(7px) rotate(1deg)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.roof{height:24px;margin:0 8px;background:var(--pink);border:4px solid var(--ink);border-bottom:0;border-radius:24px 24px 0 0;box-shadow:inset 0 6px 0 #fbcad5}
.awning{position:relative;margin:0 -8px;z-index:4;filter:drop-shadow(0 3px 0 var(--ink))}
.stripes{height:30px;background:repeating-linear-gradient(90deg,#f7a8b8 0 12.5%,#fff7f8 12.5% 25%);border:4px solid var(--ink);border-bottom:0;border-radius:6px 6px 0 0}
.scallop{height:18px;margin:0 4px;background:repeating-linear-gradient(90deg,#f7a8b8 0 12.5%,#fff7f8 12.5% 25%);
  -webkit-mask:radial-gradient(ellipse 50% 100% at 50% 0,#000 96%,transparent 100%) 0 0/12.5% 100% repeat-x;
          mask:radial-gradient(ellipse 50% 100% at 50% 0,#000 96%,transparent 100%) 0 0/12.5% 100% repeat-x}
.cabinet{background:var(--pink);border:4px solid var(--ink);border-top:0;margin-top:-18px;padding:24px 12px 14px;box-shadow:inset 7px 0 0 #fbc3cf,inset -7px 0 0 #ee96aa}

/* ================= กระจกและข้างในตู้ ================= */
.glass{position:relative;width:100%;aspect-ratio:1/.86;background:linear-gradient(180deg,#fbe6ee,#f6d0dc);border:4px solid var(--ink);border-radius:8px;overflow:hidden;touch-action:manipulation}
.persp{position:absolute;inset:0;width:100%;height:100%}
.rail{position:absolute;left:0;right:0;top:0;height:9px;background:#e9a0b2;border-bottom:3px solid var(--ink);z-index:10}
.spark{position:absolute;z-index:1;animation:twinkle 2.4s ease-in-out infinite}
.spark svg{display:block}
@keyframes twinkle{0%,100%{opacity:.9;transform:scale(1)}50%{opacity:.25;transform:scale(.6)}}
.glare{position:absolute;inset:0;z-index:11;pointer-events:none;
  background:linear-gradient(118deg,transparent 0 12%,rgba(255,255,255,.5) 12% 15%,transparent 15% 19%,rgba(255,255,255,.35) 19% 20.5%,transparent 20.5% 78%,rgba(255,255,255,.35) 78% 80%,transparent 80%)}
.chute{position:absolute;right:2.5%;bottom:-4px;width:26%;height:22%;z-index:5;background:linear-gradient(90deg,#f095ab,#f9bccb 40%,#f095ab);border:3.5px solid var(--ink);border-top:0}
.chute::before{content:'';position:absolute;left:-3.5px;right:-3.5px;top:-13px;height:24px;border:3.5px solid var(--ink);border-radius:50%;background:radial-gradient(ellipse at 50% 65%,#b85a74 0 52%,#f6a9bc 58%)}

/* ================= ที่คีบ ================= */
.claw{position:absolute;left:0;top:0;width:0;z-index:8}
.carriage{position:absolute;top:0;left:-17px;width:34px;height:16px;background:#f48fb1;border:3px solid var(--ink);border-radius:0 0 9px 9px;z-index:2}
.rope{position:absolute;left:-5px;top:0;width:10px;background:linear-gradient(90deg,#9ea4ac,#f1f3f5 50%,#9ea4ac);border:2.5px solid var(--ink);border-top:0;border-bottom:0}
.head{position:absolute;top:0;overflow:visible}

/* ================= ตุ๊กตากบ ================= */
.frog{position:absolute;left:0;top:0;z-index:2;will-change:transform;pointer-events:none}
.bob.hop{animation:hop .55s ease 2}
@keyframes hop{35%{transform:translateY(-24%)}70%{transform:translateY(0) scale(1.05,.95)}}
.breath{position:relative;animation:breathe 2.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes breathe{50%{transform:scale(1.035,.965)}}
.frog.held .breath{animation:none}
.breath img{width:100%;display:block}
.gold img{filter:sepia(.7) saturate(2.4) hue-rotate(-6deg) brightness(1.06) drop-shadow(0 0 .05em #fff5b0)}
.a{position:absolute;font-size:.3em;line-height:1;transform:translate(-50%,-50%);font-family:sans-serif}
.crown{left:50%;top:5%;font-size:.34em}
.heart{left:50%;top:63%;font-size:.32em}
.zzz{left:92%;top:2%;font-size:.26em;animation:zz 2s ease-in-out infinite}
@keyframes zz{50%{transform:translate(-30%,-80%)}}
.bow{left:50%;top:47%;font-size:.27em}
.star{left:20%;top:4%;font-size:.26em}
.flower{left:82%;top:6%;font-size:.28em}
.spark1{left:86%;top:8%;font-size:.26em;animation:twinkle 1.4s infinite}
.spark2{left:12%;top:40%;font-size:.18em;animation:twinkle 1.8s .4s infinite}
.lid{position:absolute;width:13%;height:10%;transform:translate(-50%,-50%);background:var(--frog);border-radius:50%}
.lid::after{content:'';position:absolute;left:8%;right:8%;top:18%;height:45%;border-bottom:.028em solid var(--ink);border-radius:0 0 50% 50%}
.hat{position:absolute;left:50%;top:-15%;width:46%;height:30%;transform:translateX(-50%)}
.hat::before{content:'';position:absolute;left:0;right:0;top:0;height:70%;background:#fff;border:.025em solid var(--ink);border-radius:50% 50% 35% 35%;
  box-shadow:inset -.03em -.02em 0 #eee}
.hat::after{content:'';position:absolute;left:14%;right:14%;bottom:0;height:40%;background:#fff;border:.025em solid var(--ink);border-radius:.03em}

/* ================= แผงควบคุม ================= */
.panel{position:relative;margin:-2px -10px 0;background:#fdeef2;border:4px solid var(--ink);border-radius:16px;display:flex;align-items:center;justify-content:center;gap:4%;padding:14px 12px 22px;z-index:3;box-shadow:inset 0 -6px 0 #f6d3dc}
.b3d{width:36%;height:56px;border-radius:999px;border:4px solid var(--ink);font:800 25px 'Baloo 2',sans-serif;color:#fff;letter-spacing:1px;cursor:pointer;position:relative;top:0;transition:top .08s,box-shadow .08s,filter .2s;
  text-shadow:0 2px 0 rgba(90,58,58,.45)}
.start{background:radial-gradient(ellipse at 50% 30%,#a2e487,#6cc155);box-shadow:0 7px 0 -1px #4e9a3e,0 7px 0 3px var(--ink)}
.stop{background:radial-gradient(ellipse at 50% 30%,#ffe57a,#f7c531);box-shadow:0 7px 0 -1px #d39d15,0 7px 0 3px var(--ink)}
.b3d:active:not(:disabled){top:5px}
.start:active:not(:disabled){box-shadow:0 2px 0 -1px #4e9a3e,0 2px 0 3px var(--ink)}
.stop:active:not(:disabled){box-shadow:0 2px 0 -1px #d39d15,0 2px 0 3px var(--ink)}
.b3d:disabled{filter:grayscale(.6) brightness(.98);opacity:.65;cursor:not-allowed}
.b3d.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.slot{width:50px;height:50px;flex:none;border-radius:50%;background:#fff;border:4px solid var(--ink);display:grid;place-items:center;box-shadow:inset 0 0 0 5px #f2b27a}
.slot i{width:9px;height:24px;border-radius:6px;background:var(--ink)}
.slot.glow{animation:glow .5s 3}
@keyframes glow{50%{box-shadow:inset 0 0 0 5px #ffd54a,0 0 0 6px #ffe98a}}

/* ================= ฐานตู้ ================= */
.base{background:var(--pink);border:4px solid var(--ink);border-top:0;margin:-14px 0 0;padding:28px 14px 16px;display:flex;align-items:center;gap:12px;border-radius:0 0 18px 18px;box-shadow:inset 7px 0 0 #fbc3cf,inset -7px 0 0 #ee96aa}
.sticker{width:34%;position:relative;display:flex;align-items:center}
.sticker img{width:72%;filter:drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff) drop-shadow(0 3px 2px rgba(90,58,58,.25));transform:rotate(-6deg)}
.sticker svg{width:30%;margin-left:-4%}
.door{flex:1;height:118px;background:#f9c0cd;border:4px solid var(--ink);border-radius:16px;padding:9px}
.hole{height:100%;border-radius:10px;border:3px solid var(--ink);background:linear-gradient(#e2859c,#f3a7b9 40%,#f6b5c4);box-shadow:inset 0 12px 0 #d26f88;position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;cursor:pointer}
.prize{width:66px;margin-bottom:2px;animation:prizePop .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes prizePop{0%{transform:translateY(-120%) scale(.6)}100%{transform:none}}
.feet{display:flex;justify-content:space-between;padding:0 26px}
.feet i{width:48px;height:12px;background:var(--pinkD);border:4px solid var(--ink);border-top:0;border-radius:0 0 10px 10px}

/* ================= ป้ายข้อความ ================= */
.toast{position:absolute;left:50%;top:15%;max-width:88%;transform:translate(-50%,-10px) scale(.8);opacity:0;z-index:12;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:7px 14px;font:700 16px 'Mali',sans-serif;text-align:center;box-shadow:0 5px 0 rgba(90,58,58,.2);transition:.25s cubic-bezier(.3,1.5,.5,1);pointer-events:none;line-height:1.35}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.toast small{font-weight:600;font-size:13px;color:#a06070}
.hint{font:600 14px 'Mali',sans-serif;margin:12px 0 0;text-align:center;color:#a06070;min-height:20px}

/* ================= คอลเลกชัน ================= */
.colbox{width:100%;margin-top:16px;background:#fff;border:4px solid var(--ink);border-radius:20px;padding:10px 10px 12px;box-shadow:0 6px 0 #f2c6d0}
.colbox h3{margin:0 0 8px;text-align:center;font-size:19px}
.colgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ci{position:relative;background:#fff6f8;border:2.5px solid #f0c3cf;border-radius:14px;padding:12px 2px 4px;text-align:center}
.ci .cfrog{width:52%;margin:0 auto;font-size:44px}
.ci.locked .cfrog{filter:grayscale(1) brightness(.35) opacity(.35)}
.ci .cn{font-size:12px;font-weight:800;line-height:1.1;margin-top:4px;min-height:26px;display:flex;align-items:center;justify-content:center}
.ci .cc{font-size:13px;font-weight:800;color:#e06489}
.ci .rare{position:absolute;top:-7px;right:-4px;background:#ffd54a;border:2px solid var(--ink);border-radius:8px;font:700 10px 'Mali';padding:0 5px}
.ci.new{animation:bump .6s 2;border-color:#ffd54a;background:#fffbe6}

/* ================= หน้าต่างลอย ================= */
.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(253,236,240,.72);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);padding:12px}
.overlay[hidden]{display:none!important}
.card{position:relative;width:min(390px,94vw);max-height:94vh;overflow:auto;background:#fffaf9;border:4px solid var(--ink);border-radius:24px;padding:18px;box-shadow:0 8px 0 rgba(90,58,58,.22);animation:popIn .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes popIn{0%{transform:scale(.7);opacity:0}100%{transform:none;opacity:1}}
.qhead{display:flex;justify-content:space-between;align-items:center;background:var(--pink);margin:-18px -18px 12px;padding:7px 16px;border-bottom:4px solid var(--ink);border-radius:20px 20px 0 0;color:#fff;font-weight:800;font-size:18px;text-shadow:0 2px 0 rgba(90,58,58,.45)}
.timer{height:13px;border:3px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden;margin-bottom:12px}
.timer i{display:block;height:100%;width:100%;background:#7ccf6a;border-radius:99px}
.timer i.low{background:#ff8a8a}
.qtext{font:700 19px 'Mali',sans-serif;text-align:center;line-height:1.5}
.hl{color:#e06489;font-size:1.3em}
.en{font-family:'Baloo 2',sans-serif;font-size:1.6em}
.say{border:2.5px solid var(--ink);background:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:16px;vertical-align:middle;margin-left:4px;box-shadow:0 3px 0 #f0bccb}
.qpic{display:flex;justify-content:center;margin:4px 0}
.qpic:empty{display:none}
.food{display:inline-flex;align-items:center;justify-content:center}
.food.big img{width:150px;height:110px;object-fit:contain;animation:wob 2.4s ease-in-out infinite}
.food.big .emo{font-size:96px;line-height:1.1;animation:wob 2.4s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(-4deg) scale(1.04)}}
.food.sm img{width:54px;height:42px;object-fit:contain}
.food.sm .emo{font-size:38px}
.emo{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.opt{position:relative;min-height:58px;padding:6px 6px 6px 30px;background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 #f0bccb;font:700 18px 'Baloo 2','Mali','ZCOOL KuaiLe',sans-serif;cursor:pointer;line-height:1.15;transition:transform .1s}
.opt:hover:not(:disabled){background:#fff1f5;transform:translateY(-2px)}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 #f0bccb}
.opt .n{position:absolute;left:7px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;background:var(--pink2);font-size:12px;display:grid;place-items:center;line-height:1}
.opt.ok{background:#c9efb4;box-shadow:0 5px 0 #8fc977}
.opt.bad{background:#ffc4c4;box-shadow:0 5px 0 #e79a9a;animation:shake .4s}
.opt:disabled{cursor:default}
.feedback:empty{display:none}
.feedback{margin-top:12px;font:600 15px 'Mali',sans-serif;text-align:center}
.fbtitle{font-size:19px;font-weight:700;margin-bottom:6px}
.fbtitle.good{color:#4e9a3e}.fbtitle.bad{color:#e0607a}
.fb{display:flex;align-items:center;gap:10px;justify-content:center;background:#fff3f6;border:2px dashed #e9a5b6;border-radius:14px;padding:6px 10px;text-align:left}
.fb b{font-family:'Baloo 2';font-size:20px}

.intro{text-align:center}
.intro h1{margin:2px 0 6px;font-size:28px;line-height:1.15;font-family:'Mali','Baloo 2';font-weight:700}
.intro h1 .sub{color:#e06489;font-size:21px}
.introArt{display:flex;justify-content:center;align-items:flex-end;gap:4px}
.introArt img{width:54px}
.introArt .f{width:96px;animation:breathe 2.4s infinite;transform-origin:50% 100%}
.how{text-align:left;font:600 15px 'Mali';line-height:1.6;background:#fff3f6;border-radius:16px;padding:10px 12px 10px 30px;margin:10px 0}
.best{font:700 15px 'Mali';margin-bottom:10px}
.bigbtn{width:100%;height:58px;border-radius:999px;border:4px solid var(--ink);background:radial-gradient(ellipse at 50% 30%,#a2e487,#6cc155);color:#fff;font:700 23px 'Mali','Baloo 2';text-shadow:0 2px 0 rgba(90,58,58,.45);box-shadow:0 6px 0 -1px #4e9a3e,0 6px 0 3px var(--ink);cursor:pointer;position:relative;top:0}
.bigbtn:active{top:4px;box-shadow:0 2px 0 -1px #4e9a3e,0 2px 0 3px var(--ink)}
.keys{font:500 12px 'Mali';color:#a07080;margin-top:12px}
.over{text-align:center}
.over h2{margin:0 0 8px;font-family:'Mali';font-size:26px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.stat{background:#fff3f6;border-radius:14px;padding:6px;font:600 13px 'Mali'}
.stat b{display:block;font:800 26px 'Baloo 2';color:#e06489;line-height:1.2}
.newbest{font:700 17px 'Mali';color:#d39d15;margin:4px 0}
.over h3{font:700 16px 'Mali';margin:10px 0 6px}
.review{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow:auto;margin-bottom:14px}
.rv{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid #f0c3cf;border-radius:12px;padding:4px 10px;text-align:left;font:600 14px 'Mali'}
.rv b{font-family:'Baloo 2';font-size:18px}
.rv small{color:#a07080}
.caughtRow{display:flex;justify-content:center;flex-wrap:wrap;gap:4px;margin:4px 0}
.caughtRow .m{width:34px;font-size:34px}

/* ================= 3 ภาษา ================= */
.langbar{display:flex;margin:0 0 8px;border:3px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff;box-shadow:0 3px 0 #f2c6d0}
.langbar button{border:0;background:none;padding:2px 16px;font:800 15px 'Baloo 2','Mali','ZCOOL KuaiLe',sans-serif;cursor:pointer;color:var(--ink)}
.langbar.mini{display:inline-flex;margin:-4px 0 8px}
.langbar button+button{border-left:2px solid #f0c3cf}
.langbar button.on{background:var(--pink);color:#fff;text-shadow:0 1px 0 rgba(90,58,58,.5)}
.zh{font-family:'ZCOOL KuaiLe','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;font-weight:400}
.wd{display:inline-flex;flex-direction:column;align-items:center;line-height:1.1;vertical-align:middle}
.wd .py{font:600 .62em 'Baloo 2',sans-serif;color:#b06a80;letter-spacing:.3px}
.opt .wd .zh{font-size:1.25em}
.targets{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 12px}
.tgt{border:3px solid var(--ink);background:#fff;border-radius:14px;padding:6px;font:700 16px 'Mali','ZCOOL KuaiLe',sans-serif;cursor:pointer;box-shadow:0 4px 0 #f0bccb}
.tgt.on{background:#ffe3ea;border-color:#e06489;box-shadow:0 4px 0 #e06489}
.tq{font:700 15px 'Mali','ZCOOL KuaiLe';margin-top:4px}
.qchip{background:#fff;color:var(--ink);text-shadow:none;border-radius:999px;padding:0 10px;font-size:14px;border:2px solid var(--ink)}
.tri{display:flex;flex-direction:column;gap:2px;font-size:15px}
.tri .r{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.tri .r.hit{background:#fff;border-radius:8px;padding:0 4px;margin:0 -4px}
.tag{font:800 10px 'Baloo 2','ZCOOL KuaiLe','Mali';background:var(--pink2);border-radius:6px;padding:0 5px;align-self:center}
.tri b{font-family:'Baloo 2';font-size:18px}
.tri .zh{font-size:19px}
.tri small{color:#a07080}
.secbtn{width:100%;margin-top:10px;height:44px;border-radius:999px;border:3px solid var(--ink);background:#fff;font:700 16px 'Mali','ZCOOL KuaiLe';cursor:pointer;box-shadow:0 4px 0 #f0bccb}

/* ================= เอฟเฟกต์ ================= */
.flycoin{position:fixed;left:0;top:0;font-size:46px;margin:-23px 0 0 -23px;z-index:60;pointer-events:none;transition:transform .7s cubic-bezier(.45,-0.35,.6,1),opacity .7s ease-in;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-24px;width:9px;height:14px;border-radius:3px;animation:fall linear forwards}
.confetti i.h{width:auto;height:auto;background:none!important;font-style:normal;font-size:18px}
@keyframes fall{to{transform:translate(var(--dx),108vh) rotate(var(--r))}}
.poof{position:absolute;z-index:12;pointer-events:none;font-size:26px;animation:poof .9s ease-out forwards;font-family:sans-serif}
@keyframes poof{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(-50%,-140%) scale(1.5);opacity:0}}
.credit{margin-top:14px;font:700 14px 'Baloo 2','Mali',sans-serif;color:#b06a80;text-align:center;letter-spacing:.3px}
.credit b{color:#e06489}
.intro .credit{margin-top:8px;font-size:13px}
</style>
</head>
<body>
<div class="wrap">

  <!-- โลโก้ -->
  <svg class="logo" viewBox="0 0 440 128" aria-label="Frog Claw Machine">

   ========================================================= */
let actx=null, muted=false, motor=null;
function ac(){
  if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(actx && actx.state==='suspended') actx.resume();
  return actx;
}
function tone(f,d,type='sine',v=.15,delay=0,f2){
  const a=ac(); if(!a||muted) return;
  const t=a.currentTime+delay, o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+.015); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+d+.05);
}
const SFX = {

  wrong(){ tone(330,.18,'square',.07,0,220); tone(200,.3,'square',.07,.18,140); },
  coin(){ tone(988,.08,'square',.06); tone(1319,.35,'square',.06,.08); },
  click(){ tone(620,.05,'triangle',.1); },
  drop(){ tone(520,.45,'sine',.08,0,240); },
  grab(){ tone(170,.07,'square',.07); tone(130,.08,'square',.06,.07); },
  miss(){ tone(420,.15,'sawtooth',.05,0,300); tone(300,.3,'sawtooth',.05,.15,190); },
  fanfare(){ [523,659,784,1046].forEach((f,i)=>tone(f,.18,'triangle',.15,i*.11)); tone(1046,.55,'triangle',.15,.46); tone(1318,.55,'triangle',.1,.46); },
  tick(){ tone(1300,.03,'square',.025); },
  magic(){ [784,988,1175,1568,1976].forEach((f,i)=>tone(f,.2,'sine',.1,i*.07)); }
};
function motorOn(){
  const a=ac(); if(!a||muted||motor) return;
  const o=a.createOscillator(), g=a.createGain(), lfo=a.createOscillator(), lg=a.createGain(), flt=a.createBiquadFilter();
  o.type='sawtooth'; o.frequency.value=72; flt.type='lowpass'; flt.frequency.value=480;
  lfo.frequency.value=9; lg.gain.value=10; lfo.connect(lg).connect(o.frequency);
  g.gain.value=.03; o.connect(flt).connect(g).connect(a.destination); o.start(); lfo.start();
  motor={o,lfo,g};
}
function motorOff(){
  if(!motor) return;
  try{ const t=actx.currentTime; motor.g.gain.setTargetAtTime(0,t,.04); motor.o.stop(t+.3); motor.lfo.stop(t+.3); }catch(e){}
  motor=null;
}
const VOICE={en:'en-US',zh:'zh-CN',th:'th-TH'};
function speak(w,code='en'){
  if(muted||!w) return;
  try{ const u=new SpeechSynthesisUtterance(w[code]); u.lang=VOICE[code]; u.rate=.85; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){}
}

function layout(){

  minX=headW*.55; maxX=W-headW*.55; homeX=W*.845;
  headEl.style.width=headW+'px'; headEl.style.left=(-headW/2)+'px';
  for(const s of SLOTS){
    s.cx=W*s.fr;
    const bottom = s.row===0 ? H-fs*.36 : H+fs*.07;
    s.top = bottom - fs*1.07;
  }

    f.el.style.width=fs+'px'; f.el.style.fontSize=fs+'px';
    if(f.state==='pile'){ f.cx=f.slot.cx; f.top=f.slot.top; }

}

function randomType(){ return Math.random()<.10 ? 'chef' : rand(NORMAL); }
function makeFrog(slot,type,fromTop){
  const el=document.createElement('div');
  el.className='frog'; el.innerHTML=frogInner(type);
  el.style.width=fs+'px'; el.style.fontSize=fs+'px'; el.style.zIndex=slot.z;

  const f={el,type,slot,cx:slot.cx,top:fromTop?-fs*1.3:slot.top,vy:0,state:fromTop?'fallback':'pile'};
  frogs.push(f); return f;
}
function setFrogType(f,type){
  f.type=type; f.el.innerHTML=frogInner(type);
}
function fillPile(){
  frogs.forEach(f=>f.el.remove()); frogs=[];
  SLOTS.forEach(s=>makeFrog(s,randomType(),false));
}
function refill(slot){
  setTimeout(()=>{ if(!frogs.some(f=>f.slot===slot)) makeFrog(slot,randomType(),true); },700);
}

function wordPool(){
  const lv=S.level;
  let p=WORDS.filter(w=>w.lv<=Math.min(3,lv));
  if(lv>=3) p=p.concat(WORDS.filter(w=>w.lv===3));          // เลเวลสูง: เพิ่มน้ำหนักคำยาก
  if(lv>=4) p=p.concat(WORDS.filter(w=>w.lv>=2));
  return p;
}
function pickWord(){
  let p=wordPool().filter(w=>!S.recent.includes(w.en));
  if(!p.length) p=wordPool();
  const w=rand(p);
  S.recent.push(w.en); if(S.recent.length>16) S.recent.shift();
  return w;
}
function distractors(w){
  const c=shuffle(WORDS.filter(x=>x!==w && !(w.g && x.g===w.g)));
  const near=c.filter(x=>Math.abs(x.lv-w.lv)<=1);
  const out=[];
  for(const x of near.concat(c)){ if(!out.includes(x)) out.push(x); if(out.length===3) break; }
  return out;
}
function foodEl(w,cls){
  return w.img ? `<span class="food ${cls}"><img src="${IMG[w.img]}" alt=""></span>` : `<span class="food ${cls}"><span class="emo">${w.emoji}</span></span>`;
}

}

}
const pickTarget=()=> S.target==='mix' ? rand(LANGS) : S.target;
/* ภาษาที่ผู้เล่นรู้ = ภาษาเมนู (ถ้าซ้ำกับภาษาที่ฝึก ใช้ภาษาอื่นแทน) */
const knownFor=tg=> UI!==tg ? UI : (tg==='th'?'en':'th');
function askQuestion(){
  if(S.phase==='over') return;
  S.phase='quiz'; S.qn++;
  const w=pickWord();
  const tg=pickTarget(), kn=knownFor(tg);
  const r=Math.random(), type = r<.4?'pic' : r<.7?'to' : 'mean';
  const optLang = type==='mean' ? kn : tg;
  const opts=shuffle([w,...distractors(w)]);
  Q={w,type,opts,tg,kn,start:performance.now(),done:false,lastTick:99};
  $('qnum').textContent=t('qn',{n:S.qn});
  $('qchip').textContent=FLAG[tg]+' '+LN[UI][tg];
  $('qlv').textContent=`Lv ${S.level}`+(S.streak>=2?` 🔥${S.streak}`:'');
  $('qpic').innerHTML=''; $('feedback').innerHTML='';
  if(type==='pic'){
    $('qtext').innerHTML=t('qPic',{T:LN[UI][tg]});
    $('qpic').innerHTML=foodEl(w,'big');
  }else if(type==='to'){
    $('qtext').innerHTML=t('qTo',{w:`<span class="hl">“${wordHTML(w,kn)}”</span>`,T:LN[UI][tg]});
  }else{
    $('qtext').innerHTML=t('qMean',{w:`<span class="hl${tg==='en'?' en':''}">${wordHTML(w,tg)}</span><button class="say" id="sayBtn" aria-label="sound">🔊</button>`});
    $('sayBtn').onclick=()=>speak(w,tg);
    setTimeout(()=>speak(w,tg),350);
  }
  const box=$('opts'); box.innerHTML='';
  opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt';
    b.innerHTML=`<span class="n">${i+1}</span>${wordHTML(o,optLang)}`;
    b.onclick=()=>answer(o);
    o._btn=b; box.appendChild(b);
  });
  const bar=$('timerBar'); bar.style.width='100%'; bar.classList.remove('low');
  $('quiz').hidden=false;
  const card=$('quiz').querySelector('.card'); card.style.animation='none'; void card.offsetWidth; card.style.animation='';
  setHint(t('hintPick'));
}
function answer(o){
  if(!Q||Q.done) return;
  Q.done=true;
  const w=Q.w, ok=o===w;
  Q.opts.forEach(x=>{ x._btn.disabled=true; if(x===w) x._btn.classList.add('ok'); });
  if(o && !ok) o._btn.classList.add('bad');
  const info=triHTML(w,Q.tg);
  if(ok){
    SFX.correct(); speak(w,Q.tg);
    S.correct++; S.streak++; S.score+=10+(S.streak>=3?5:0);
    $('feedback').innerHTML=`<div class="fbtitle good">${t('good')}</div>${info}`;
    setTimeout(onCorrect,1500);
  }else{
    SFX.wrong(); setTimeout(()=>speak(w,Q.tg),300);
    S.streak=0; S.lives--; S.wrong.push(w);
    $('feedback').innerHTML=`<div class="fbtitle bad">${o?t('bad'):t('timeout')}</div>${info}`;
    bump('lives');
    const m=$('machine'); m.classList.remove('shake'); void m.offsetWidth; m.classList.add('shake');
    setTimeout(()=>{ if(S.lives<=0) gameOver(); else askQuestion(); },2600);
  }
  updateHUD();
}
function onCorrect(){
  $('quiz').hidden=true;
  S.phase='ready';
  const oldLv=S.level; S.level=1+Math.floor(S.correct/5);
  confetti(36);
  frogs.forEach((f,i)=>{ if(f.state!=='pile') return; const b=f.el.querySelector('.bob'); b.classList.remove('hop'); void b.offsetWidth; setTimeout(()=>b.classList.add('hop'),i*60); });
  ensureMachineVisible();
  flyCoin(()=>{
    S.coins++; SFX.coin(); bump('pCoin');
    const s=$('slot'); s.classList.remove('glow'); void s.offsetWidth; s.classList.add('glow');
    updateHUD(); syncButtons();
  });
  let msg=t('tCoin');
  if(S.level>oldLv){ msg=t('tLv',{n:S.level}); bump('pLv'); }
  toast(msg,2600);
  if(S.streak>0 && S.streak%5===0) setTimeout(spawnGolden,900);
  setHint(t('hintStart'));
}

/* ตอบถูกติดกัน 5 ข้อ → Golden Frog ปรากฏ */
function spawnGolden(){
  if(frogs.some(f=>f.type==='golden')) return;
  const cand=frogs.filter(f=>f.state==='pile');
  if(!cand.length) return;
  const f=rand(cand); setFrogType(f,'golden');
  poof(f.cx,f.top+fs*.4,'✨'); SFX.magic();
  toast(t('tGold'),2800);
}

/* =========================================================
   ระบบที่คีบ
   ========================================================= */
function canStart(){ return S.phase==='ready' && S.coins>0 && C.state==='idle'; }
function startClaw(){
  if(!canStart()) return;
  ac(); SFX.click();
  S.coins--; S.phase='claw'; updateHUD();
  C.state='moving'; C.dir=-1; C.slipped=false; C.held=null; C.target=null;
  C.auto=performance.now()+10000; // ไม่กด STOP ใน 10 วิ จะหย่อนเอง
  motorOn(); syncButtons();
  setHint(t('hintStop'));
}
function stopClaw(){
  if(C.state!=='moving') return;
  motorOff(); SFX.drop();
  // หาตุ๊กตาที่อยู่ใต้ที่คีบ (ตัวที่อยู่สูงสุดจะโดนก่อน)
  const under=frogs.filter(f=>f.state==='pile' && Math.abs(f.cx-C.x)<fs*.36);
  under.sort((a,b)=>a.top-b.top);
  C.target=under[0]||null;
  C.willSlip = C.target ? Math.random()>=.85 : false; // คีบติด 85%
  C.targetRope = C.target ? C.target.top - headH*.28 : H*.62;
  C.state='descending';
  syncButtons(); setHint('');
}
function speed(){ return Math.min(W*1.5, W*.55*(1+.22*(S.level-1))); }

function updateClaw(dt,now){
  switch(C.state){
    case 'moving':
      C.x+=C.dir*speed()*dt;
      if(C.x<minX){C.x=minX;C.dir=1} if(C.x>maxX){C.x=maxX;C.dir=-1}
      if(now>C.auto) stopClaw();
      break;
    case 'descending':
      C.open=Math.min(1,C.open+dt*3.5);
      C.rope+=H*.8*dt;
      if(C.rope>=C.targetRope){ C.rope=C.targetRope; C.state='closing'; C.t=0; }
      break;
    case 'closing':
      C.t+=dt; C.open=Math.max(0,1-C.t/.3);
      if(C.t>=.42){
        if(C.target && C.target.state==='pile'){ C.held=C.target; C.held.state='held'; C.held.el.style.zIndex=7; C.held.el.classList.add('held'); SFX.grab(); }
        C.slipRope=C.targetRope*.55; C.state='lifting';
      }
      break;
    case 'lifting':
      C.rope-=H*.5*dt;
      if(C.held && C.willSlip && C.rope<C.slipRope){
        const f=C.held; C.held=null; C.slipped=true;
        f.state='fallback'; f.vy=0; f.el.classList.remove('held');
        C.open=.6; SFX.miss();
      }
      if(!C.held) C.open+=(.15-C.open)*Math.min(1,dt*4);
      if(C.rope<=rope0()){ C.rope=rope0(); C.state='returning'; }
      break;
    case 'returning': {
      const d=homeX-C.x, st=W*.6*dt;
      if(Math.abs(d)<=st){
        C.x=homeX;
        if(C.held){ C.state='releasing'; C.t=0; }
        else{ C.state='idle'; clawResult(C.slipped?'slip':'miss'); }
      } else C.x+=Math.sign(d)*st;
      break; }
    case 'releasing':
      C.t+=dt; C.open=Math.min(1,C.t/.25);
      if(C.t>.25 && C.held){
        const f=C.held; C.held=null;
        f.state='chute'; f.vy=0; f.el.style.zIndex=4; SFX.drop();
      }
      if(C.t>.9) C.state='idle';
      break;
    case 'idle':
      C.open+=(.35-C.open)*Math.min(1,dt*3);
      break;
  }
  if(C.held){ C.held.cx=C.x; C.held.top=C.rope+headH*.28; }
}
function updateFrogs(dt){
  for(const f of frogs.slice()){
    if(f.state==='fallback'){
      f.vy+=1700*dt; f.top+=f.vy*dt; f.cx+=(f.slot.cx-f.cx)*Math.min(1,dt*6);
      if(f.top>=f.slot.top){ f.top=f.slot.top; f.cx=f.slot.cx; f.vy=0; f.state='pile'; f.el.style.zIndex=f.slot.z; f.el.classList.remove('held'); }
    }else if(f.state==='chute'){
      f.vy+=1700*dt; f.top+=f.vy*dt;
      if(f.top>H+10){ f.el.remove(); frogs=frogs.filter(x=>x!==f); prize(f.type); refill(f.slot); }
    }
  }
}
function render(){
  clawEl.style.transform=`translateX(${C.x}px)`;
  ropeEl.style.height=(C.rope+4)+'px';
  headEl.style.top=C.rope+'px';
  const a=-9+25*C.open;
  armL.setAttribute('transform',`rotate(${a} 40 13)`);
  armR.setAttribute('transform',`rotate(${-a} 40 13)`);
  for(const f of frogs) f.el.style.transform=`translate(${f.cx-fs/2}px,${f.top}px)`;
}

/* ผลการคีบ */
function prize(type){
  const ft=TYPES[type];
  SFX.fanfare(); confetti(50,true);
  S.caught++; S.run.push(type); S.score+=ft.pts||50;
  SAVE.col[type]=(SAVE.col[type]||0)+1; persist();
  $('door').innerHTML=`<div class="prize">${frogInner(type)}</div>`;
  $('door').firstChild.style.fontSize='66px';
  toast(t('tGot',{f:fname(type)})+(ft.rare?`<br><small>${t('tRare')}</small>`:''),2400);
  bump('pCaught'); updateHUD(); renderCollection(type);
  setHint('');
  setTimeout(askQuestion,2300);
}
function clawResult(kind){
  SFX.miss();
  toast(kind==='slip'?t('tSlip'):t('tMiss'),2000);
  setTimeout(askQuestion,1900);
}

/* =========================================================
   HUD / ปุ่ม / ข้อความ
   ========================================================= */
function updateHUD(){
  $('lives').textContent='❤️'.repeat(Math.max(0,S.lives))+'🤍'.repeat(3-Math.max(0,S.lives));
  $('coins').textContent=S.coins; $('caught').textContent=S.caught;
  $('score').textContent=S.score; $('level').textContent=S.level;
}
function syncButtons(){
  const bs=$('btnStart'), bp=$('btnStop');
  bs.disabled=!canStart(); bs.classList.toggle('pulse',canStart());
  bp.disabled=C.state!=='moving'; bp.classList.toggle('pulse',C.state==='moving');
}
function bump(id){ const e=$(id); e.classList.remove('bump'); void e.offsetWidth; e.classList.add('bump'); }
let toastT=0;
function toast(html,ms=2200){
  const t=$('toast'); t.innerHTML=html; t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),ms);
}
function setHint(s){ $('hint').textContent=s; }
function ensureMachineVisible(){
  const r=$('btnStart').getBoundingClientRect();
  if(r.bottom>innerHeight-10 || r.top<0) $('glass').scrollIntoView({behavior:'smooth',block:'start'});
}

/* =========================================================
   เอฟเฟกต์: เหรียญ คอนเฟตติ ประกาย
   ========================================================= */
function flyCoin(cb){
  const c=document.createElement('div'); c.className='flycoin'; c.textContent='🪙';
  const sx=innerWidth/2, sy=innerHeight*.4;
  c.style.transform=`translate(${sx}px,${sy}px) scale(1.3)`;
  document.body.appendChild(c);
  setTimeout(()=>{
    const r=$('slot').getBoundingClientRect();
    c.style.transform=`translate(${r.left+r.width/2}px,${r.top+r.height/2}px) scale(.45)`;
    c.style.opacity='.3';
  },320);
  setTimeout(()=>{ c.remove(); cb(); },1050);
}
function confetti(n=40,hearts=false){
  const box=document.createElement('div'); box.className='confetti';
  const cols=['#f7a8b8','#a8d08d','#ffd54a','#9ad0f5','#ffb38a','#d7b5f5'];
  for(let i=0;i<n;i++){
    const s=document.createElement('i');
    if(hearts && i%4===0){ s.className='h'; s.textContent=rand(['💗','🐸','⭐']); }
    s.style.left=Math.random()*100+'%';
    s.style.background=rand(cols);
    s.style.animationDuration=(1.4+Math.random()*1.3)+'s';
    s.style.animationDelay=(Math.random()*.35)+'s';
    s.style.setProperty('--dx',(Math.random()*160-80)+'px');
    s.style.setProperty('--r',(Math.random()*900-450)+'deg');
    box.appendChild(s);
  }
  document.body.appendChild(box); setTimeout(()=>box.remove(),3200);
}
function poof(x,y,ch){
  for(let i=0;i<5;i++){
    const p=document.createElement('div'); p.className='poof'; p.textContent=ch;
    p.style.left=(x+(Math.random()-.5)*fs)+'px'; p.style.top=(y+(Math.random()-.5)*fs*.6)+'px';
    p.style.animationDelay=(i*.08)+'s';
    glass.appendChild(p); setTimeout(()=>p.remove(),1300);
  }
}

/* =========================================================
   คอลเลกชัน
   ========================================================= */
function renderCollection(hl){
  $('collection').innerHTML=Object.keys(TYPES).map(k=>{
    const n=SAVE.col[k]||0, ft=TYPES[k];
    return `<div class="ci ${n?'':'locked'} ${hl===k?'new':''}">
      ${ft.rare?`<span class="rare">${t('rare')}</span>`:''}
      <div class="cfrog">${frogInner(k)}</div>
      <div class="cn">${n?fname(k):'???'}</div>
      <div class="cc">×${n}</div></div>`;
  }).join('');
}

/* =========================================================
   เริ่ม / จบเกม
   ========================================================= */
function startGame(){
  ac();
  resetState(); S.target=SAVE.target; updateHUD();
  $('startScr').hidden=true; $('overScr').hidden=true; $('door').innerHTML='';
  C.state='idle'; C.held=null; C.x=homeX; C.rope=rope0();
  fillPile(); layout(); syncButtons();
  setTimeout(askQuestion,350);
}
function gameOver(){
  S.phase='over'; $('quiz').hidden=true; motorOff(); syncButtons();
  $('oScore').textContent=S.score; $('oCorrect').textContent=S.correct;
  $('oCaught').textContent=S.caught; $('oLevel').textContent=S.level;
  $('oFrogs').innerHTML=S.run.map(k=>`<div class="m">${frogInner(k)}</div>`).join('');
  S._newBest=S.score>SAVE.best && S.score>0;
  if(S._newBest){ SAVE.best=S.score; persist(); }
  gameOverText();
  $('overScr').hidden=false;
  setHint(t('hint0'));
}
function gameOverText(){
  $('oBest').textContent=S._newBest?t('newBest'):`${t('best')} ${SAVE.best}`;
  const uniq=[...new Set(S.wrong)];
  $('oRevTitle').style.display=uniq.length?'':'none';
  $('oReview').innerHTML=uniq.map(w=>triHTML(w)).join('');
}

/* =========================================================
   การควบคุม
   ========================================================= */
$('btnStart').onclick=startClaw;
$('btnStop').onclick=stopClaw;
$('btnPlay').onclick=startGame;
$('btnAgain').onclick=startGame;
$('btnMenu').onclick=()=>{ $('overScr').hidden=true; $('startScr').hidden=false; $('bestStart').textContent=SAVE.best; };
/* สลับภาษาเมนู */
function applyLang(){
  document.documentElement.lang = UI==='zh'?'zh-CN':UI;
  document.querySelectorAll('[data-i]').forEach(e=>{ e.innerHTML=T[e.dataset.i][UI]; });
  $('howList').innerHTML=T.how[UI].map(x=>`<li>${x}</li>`).join('');
  document.querySelectorAll('.langbar button').forEach(b=>b.classList.toggle('on',b.dataset.l===UI));
  renderCollection();
  if(S.phase==='start'||S.phase==='over') setHint(t('hint0'));
  else if(S.phase==='ready') setHint(t('hintStart'));
  else if(S.phase==='claw' && C.state==='moving') setHint(t('hintStop'));
  else if(S.phase==='quiz') setHint(t('hintPick'));
  if(!$('overScr').hidden) gameOverText();
}
document.querySelectorAll('.langbar button').forEach(b=>b.onclick=()=>{ UI=b.dataset.l; SAVE.ui=UI; persist(); SFX.click(); applyLang(); });
/* เลือกภาษาที่จะฝึก */
function applyTarget(){ document.querySelectorAll('.tgt').forEach(b=>b.classList.toggle('on',b.dataset.t===SAVE.target)); }
document.querySelectorAll('.tgt').forEach(b=>b.onclick=()=>{ SAVE.target=b.dataset.t; persist(); SFX.click(); applyTarget(); });
$('mute').onclick=()=>{ muted=!muted; $('mute').textContent=muted?'🔇':'🔈'; if(muted){ motorOff(); try{speechSynthesis.cancel()}catch(e){} } else if(C.state==='moving') motorOn(); };
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){
    if(!$('startScr').hidden || !$('overScr').hidden) return;
    e.preventDefault();
    if(canStart()) startClaw(); else if(C.state==='moving') stopClaw();
  }else if(/^[1-4]$/.test(e.key) && !$('quiz').hidden && Q && !Q.done){
    answer(Q.opts[+e.key-1]);
  }else if(e.key==='Enter' && !$('startScr').hidden){ startGame(); }
});
addEventListener('resize',layout);

/* =========================================================
   ลูปหลัก
   ========================================================= */
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  updateClaw(dt,now); updateFrogs(dt);
  // ตัวจับเวลาคำถาม
  if(S.phase==='quiz' && Q && !Q.done && !$('quiz').hidden){
    const rem=15-(now-Q.start)/1000, bar=$('timerBar');
    bar.style.width=Math.max(0,rem/15*100)+'%';
    bar.classList.toggle('low',rem<5);
    const sec=Math.ceil(rem); if(sec<=5 && sec<Q.lastTick && sec>0){ Q.lastTick=sec; SFX.tick(); }
    if(rem<=0) answer(null);
  }
  render();
  requestAnimationFrame(loop);
}

/* =========================================================
   เริ่มต้น
   ========================================================= */
$('logoFrog').setAttribute('href',IMG.frog);
$('stickerFrog').src=IMG.frog;
$('introArt').innerHTML=`<img src="${IMG.burger}" alt=""><img class="f" src="${IMG.frog}" alt=""><img src="${IMG.icecream}" alt="">`;
$('bestStart').textContent=SAVE.best;
fillPile(); layout(); applyLang(); applyTarget(); updateHUD(); syncButtons();
requestAnimationFrame(loop);
</script>
